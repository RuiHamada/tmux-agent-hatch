# tmux-agent-hatch — tmux 側の設定本体。
# ~/.tmux.conf から次の 2 行で読み込む(install.sh が追記する):
#   HATCH_DIR="/path/to/tmux-agent-hatch"
#   source-file "$HATCH_DIR/hatch.tmux.conf"

# ===== 上流 tmux-claude-hatch(Claude Code 用: prefix+y 起動 / prefix+u ピッカー) =====
set -g @claude_launch_key     'y'
set -g @claude_list_key       'u'
set -g @claude_command        'claude'
set -g @claude_session_prefix 'claude-'
set -g @claude_popup_width    '90%'
set -g @claude_popup_height   '90%'
run-shell "$HATCH_DIR/vendor/tmux-claude-hatch/claude_hatch.tmux"

# ===== Codex 用(prefix+Y 起動 / prefix+U セッション一覧) =====
set -g @codex_launch_key      'Y'
set -g @codex_list_key        'U'
set -g @codex_command         'codex'
set -g @codex_session_prefix  'codex-'
run-shell "$HATCH_DIR/bin/bind-codex.sh"

# ===== ペインリサイズ(Option + 矢印、3 セルずつ) =====
bind-key -n M-Left  resize-pane -L 3
bind-key -n M-Right resize-pane -R 3
bind-key -n M-Up    resize-pane -U 3
bind-key -n M-Down  resize-pane -D 3

# ===== コピーモード(vi 風、macOS クリップボード) =====
# prefix+[ で入る。v 選択開始 / V 行選択 / C-v 矩形 / Enter・y でコピーして抜ける
setw -g mode-keys vi
bind-key -T copy-mode-vi v      send-keys -X begin-selection
bind-key -T copy-mode-vi V      send-keys -X select-line
bind-key -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter  send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
