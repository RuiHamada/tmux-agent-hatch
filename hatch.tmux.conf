# tmux-agent-hatch — tmux-side configuration.
# ~/.tmux.conf loads it with (install.sh appends these two lines):
#   HATCH_DIR="/path/to/tmux-agent-hatch"
#   source-file "$HATCH_DIR/hatch.tmux.conf"

# ===== Agents (prefix+y Claude / prefix+Y Codex / prefix+u picker) =====
set -g @claude_launch_key     'y'
set -g @codex_launch_key      'Y'
set -g @hatch_list_key        'u'
set -g @hatch_worktree_key    'W'
set -g @hatch_worktree_dir    ''         # worktrees go here/<branch>; default ../<repo>-wt
set -g @claude_command        'claude'
set -g @codex_command         'codex'
set -g @claude_args           ''
set -g @codex_args            ''
set -g @claude_session_prefix 'claude-'
set -g @codex_session_prefix  'codex-'
set -g @claude_popup_width    '90%'
set -g @claude_popup_height   '90%'
set -g @claude_sort           'status'   # picker order: 'status' or 'recent'
set -g @claude_picker_cache   'on'
set -g @claude_forward_bell   'on'
run-shell "$HATCH_DIR/scripts/hatch.tmux"

# ===== Pane resize (Option + arrows, 3 cells per press) =====
bind-key -n M-Left  resize-pane -L 3
bind-key -n M-Right resize-pane -R 3
bind-key -n M-Up    resize-pane -U 3
bind-key -n M-Down  resize-pane -D 3

# ===== Copy mode (vi keys, macOS clipboard) =====
# prefix+[ to enter. v start / V line / C-v rectangle / Enter or y copy and leave
setw -g mode-keys vi
bind-key -T copy-mode-vi v      send-keys -X begin-selection
bind-key -T copy-mode-vi V      send-keys -X select-line
bind-key -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter  send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
